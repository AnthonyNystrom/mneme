name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and deploy MkDocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # `[all]` so mkdocstrings can resolve every public symbol (including
        # optional-dep modules like _store_redis, _store_postgres, _store_dynamodb).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,all]"

      - name: Build (strict)
        run: mkdocs build --strict

      - name: Deploy to gh-pages
        run: mkdocs gh-deploy --force --clean --no-history
