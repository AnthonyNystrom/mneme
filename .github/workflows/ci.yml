name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"
      - name: ruff
        run: ruff check src tests
      - name: ruff format check
        run: ruff format --check src tests
      - name: mypy
        run: mypy --strict src/mneme

  test-core:
    name: Test core (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (core only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        # Coverage is enforced in the dedicated `coverage` job below, which
        # runs with all extras + service containers. The 90% gate excludes
        # optional-dep code paths in jobs without the dep.
        #
        # macOS runners are slower and multiprocessing.spawn pays ~0.5-1 s
        # per worker cold-start; triple the stress-test duration budget there
        # so the short multiprocess stress tests stop flaking.
        env:
          MNEME_STRESS_DURATION_MULTIPLIER: ${{ matrix.os == 'macos-latest' && '3' || '1' }}
        run: pytest -ra

  coverage:
    name: Coverage gate (90%, [all] extras + services)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mneme
          POSTGRES_PASSWORD: mneme
          POSTGRES_DB: mneme_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
    env:
      RUN_REDIS_INTEGRATION: "1"
      RUN_POSTGRES_INTEGRATION: "1"
      RUN_DYNAMODB_INTEGRATION: "1"
      MNEME_REDIS_URL: "redis://localhost:6379/15"
      MNEME_PG_URL: "postgresql://mneme:mneme@localhost:5432/mneme_test"
      MNEME_DYNAMODB_ENDPOINT: "http://localhost:8000"
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (all extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"
      - name: Test with coverage
        run: pytest -ra --cov=mneme --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  test-hnsw:
    name: Test [hnsw] (ubuntu / py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,hnsw]"
      - name: Test
        run: pytest tests/test_index_hnsw.py -ra

  test-redis:
    name: Test [redis] (ubuntu / py3.12)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_REDIS_INTEGRATION: "1"
      MNEME_REDIS_URL: "redis://localhost:6379/15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,redis]"
      - name: Test
        run: pytest tests/test_store_redis.py tests/test_store_protocol_compliance.py -ra

  test-postgres:
    name: Test [postgres] (ubuntu / py3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mneme
          POSTGRES_PASSWORD: mneme
          POSTGRES_DB: mneme_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_POSTGRES_INTEGRATION: "1"
      MNEME_PG_URL: "postgresql://mneme:mneme@localhost:5432/mneme_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: Test
        run: pytest tests/test_store_postgres.py tests/test_store_protocol_compliance.py -ra

  test-dynamodb:
    name: Test [dynamodb] (ubuntu / py3.12)
    runs-on: ubuntu-latest
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
    env:
      RUN_DYNAMODB_INTEGRATION: "1"
      MNEME_DYNAMODB_ENDPOINT: "http://localhost:8000"
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dynamodb]"
      - name: Test
        run: pytest tests/test_store_dynamodb.py tests/test_store_protocol_compliance.py -ra

  test-prometheus:
    name: Test [prometheus] (ubuntu / py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,prometheus]"
      - name: Test
        run: pytest tests/test_adapters_prometheus.py -ra

  test-otel:
    name: Test [otel] (ubuntu / py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,otel]"
      - name: Test
        run: pytest tests/test_adapters_otel.py -ra

  no-fstring-sql:
    name: Guard against f-string SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: grep guard
        run: |
          # Parameterized SQL only. Catches f-string SQL by requiring both a
          # SQL verb and a SQL structural keyword on the same line — narrower
          # than a bare verb match, so prose containing the word "CREATE"
          # in an error message doesn't false-positive.
          PATTERN='f["'"'"']([^"'"'"']*)(SELECT[ \t]+[a-zA-Z_*]|INSERT[ \t]+INTO|UPDATE[ \t]+[a-zA-Z_."{]|DELETE[ \t]+FROM|CREATE[ \t]+(TABLE|INDEX|SCHEMA|VIEW|TRIGGER)|DROP[ \t]+(TABLE|INDEX|SCHEMA|VIEW)|ALTER[ \t]+(TABLE|SCHEMA))'
          if grep -rEn "$PATTERN" src/; then
            echo "f-string SQL detected — use parameterized queries (PEP 249 placeholders) or psycopg.sql.Identifier() for identifier interpolation."
            exit 1
          fi
