name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"
      - name: ruff
        run: ruff check src tests
      - name: ruff format check
        run: ruff format --check src tests
      - name: mypy
        run: mypy --strict src/mneme

  test-core:
    name: Test core (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (core only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        # Coverage is enforced in the dedicated `coverage` job below, which
        # runs with all extras + service containers. Per PRD §17.4: the 90%
        # gate excludes optional-dep code paths in jobs without the dep.
        run: pytest -ra

  coverage:
    name: Coverage gate (90%, [all] extras + services)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mneme
          POSTGRES_PASSWORD: mneme
          POSTGRES_DB: mneme_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
    env:
      RUN_REDIS_INTEGRATION: "1"
      RUN_POSTGRES_INTEGRATION: "1"
      RUN_DYNAMODB_INTEGRATION: "1"
      MNEME_REDIS_URL: "redis://localhost:6379/15"
      MNEME_PG_URL: "postgresql://mneme:mneme@localhost:5432/mneme_test"
      MNEME_DYNAMODB_ENDPOINT: "http://localhost:8000"
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (all extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"
      - name: Test with coverage
        run: pytest -ra --cov=mneme --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  test-hnsw:
    name: Test [hnsw] (ubuntu / py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,hnsw]"
      - name: Test
        run: |
          files=""
          [ -f tests/test_index_hnsw.py ] && files="$files tests/test_index_hnsw.py"
          if [ -z "$files" ]; then
            echo "::notice::test_index_hnsw.py not present yet (lands in Phase 5); skipping."
            exit 0
          fi
          pytest $files -ra

  test-redis:
    name: Test [redis] (ubuntu / py3.12)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_REDIS_INTEGRATION: "1"
      MNEME_REDIS_URL: "redis://localhost:6379/15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,redis]"
      - name: Test
        run: |
          files=""
          [ -f tests/test_store_redis.py ] && files="$files tests/test_store_redis.py"
          [ -f tests/test_store_protocol_compliance.py ] && files="$files tests/test_store_protocol_compliance.py"
          if [ -z "$files" ]; then
            echo "::notice::Redis store tests not present yet (lands in Phase 3b); skipping."
            exit 0
          fi
          pytest $files -ra

  test-postgres:
    name: Test [postgres] (ubuntu / py3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mneme
          POSTGRES_PASSWORD: mneme
          POSTGRES_DB: mneme_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_POSTGRES_INTEGRATION: "1"
      MNEME_PG_URL: "postgresql://mneme:mneme@localhost:5432/mneme_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: Test
        run: |
          files=""
          [ -f tests/test_store_postgres.py ] && files="$files tests/test_store_postgres.py"
          [ -f tests/test_store_protocol_compliance.py ] && files="$files tests/test_store_protocol_compliance.py"
          if [ -z "$files" ]; then
            echo "::notice::Postgres store tests not present yet (lands in Phase 3b); skipping."
            exit 0
          fi
          pytest $files -ra

  test-dynamodb:
    name: Test [dynamodb] (ubuntu / py3.12)
    runs-on: ubuntu-latest
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
    env:
      RUN_DYNAMODB_INTEGRATION: "1"
      MNEME_DYNAMODB_ENDPOINT: "http://localhost:8000"
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dynamodb]"
      - name: Test
        run: |
          files=""
          [ -f tests/test_store_dynamodb.py ] && files="$files tests/test_store_dynamodb.py"
          [ -f tests/test_store_protocol_compliance.py ] && files="$files tests/test_store_protocol_compliance.py"
          if [ -z "$files" ]; then
            echo "::notice::DynamoDB store tests not present yet; skipping."
            exit 0
          fi
          pytest $files -ra

  test-prometheus:
    name: Test [prometheus] (ubuntu / py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,prometheus]"
      - name: Test
        run: |
          files=""
          [ -f tests/test_adapters_prometheus.py ] && files="$files tests/test_adapters_prometheus.py"
          if [ -z "$files" ]; then
            echo "::notice::Prometheus adapter tests not present yet (lands in Phase 12); skipping."
            exit 0
          fi
          pytest $files -ra

  test-otel:
    name: Test [otel] (ubuntu / py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,otel]"
      - name: Test
        run: |
          files=""
          [ -f tests/test_adapters_otel.py ] && files="$files tests/test_adapters_otel.py"
          if [ -z "$files" ]; then
            echo "::notice::OpenTelemetry adapter tests not present yet (lands in Phase 12); skipping."
            exit 0
          fi
          pytest $files -ra

  no-fstring-sql:
    name: Guard against f-string SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: grep guard
        run: |
          # Parameterized SQL only. Catches f-string SQL by requiring both a
          # SQL verb and a SQL structural keyword on the same line — narrower
          # than a bare verb match, so prose containing the word "CREATE"
          # in an error message doesn't false-positive.
          PATTERN='f["'"'"']([^"'"'"']*)(SELECT[ \t]+[a-zA-Z_*]|INSERT[ \t]+INTO|UPDATE[ \t]+[a-zA-Z_."{]|DELETE[ \t]+FROM|CREATE[ \t]+(TABLE|INDEX|SCHEMA|VIEW|TRIGGER)|DROP[ \t]+(TABLE|INDEX|SCHEMA|VIEW)|ALTER[ \t]+(TABLE|SCHEMA))'
          if grep -rEn "$PATTERN" src/; then
            echo "f-string SQL detected — use parameterized queries (PEP 249 placeholders) or psycopg.sql.Identifier() for identifier interpolation."
            exit 1
          fi
