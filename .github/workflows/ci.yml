name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"
      - name: ruff
        run: ruff check src tests
      - name: ruff format check
        run: ruff format --check src tests
      - name: mypy
        run: mypy --strict src/mneme

  test-core:
    name: Test core (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (core only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -ra --cov=mneme --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: coverage.xml

  test-hnsw:
    name: Test [hnsw] (ubuntu / py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,hnsw]"
      - name: Test (HNSW paths only)
        run: pytest tests/test_index_hnsw.py -ra || pytest tests/ -ra -k "hnsw"

  test-redis:
    name: Test [redis] (ubuntu / py3.12)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_REDIS_INTEGRATION: "1"
      MNEME_REDIS_URL: "redis://localhost:6379/15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,redis]"
      - name: Test
        run: pytest tests/test_store_redis.py tests/test_store_protocol_compliance.py -ra

  test-postgres:
    name: Test [postgres] (ubuntu / py3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mneme
          POSTGRES_PASSWORD: mneme
          POSTGRES_DB: mneme_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_POSTGRES_INTEGRATION: "1"
      MNEME_PG_URL: "postgresql://mneme:mneme@localhost:5432/mneme_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: Test
        run: pytest tests/test_store_postgres.py tests/test_store_protocol_compliance.py -ra

  test-prometheus:
    name: Test [prometheus] (ubuntu / py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,prometheus]"
      - name: Test
        run: pytest tests/test_adapters_prometheus.py -ra

  test-otel:
    name: Test [otel] (ubuntu / py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,otel]"
      - name: Test
        run: pytest tests/test_adapters_otel.py -ra

  no-fstring-sql:
    name: Guard against f-string SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: grep guard
        run: |
          # Parameterized SQL only. f-string SQL is forbidden.
          ! grep -rEn 'f".*(SELECT|INSERT|UPDATE|DELETE|CREATE|DROP|ALTER) ' src/ || (echo "f-string SQL detected" && exit 1)
