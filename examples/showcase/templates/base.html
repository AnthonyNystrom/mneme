<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}mneme showcase{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">mneme</span>
      <span class="tagline">layered semantic cache · live demo</span>
    </div>
    <nav>
      <a href="/" class="{% if request.path == '/' %}active{% endif %}">Dashboard</a>
      <a href="/try" class="{% if request.path == '/try' %}active{% endif %}">Classify</a>
      <a href="/dedup" class="{% if request.path == '/dedup' %}active{% endif %}">Dedup</a>
      <a href="/translate" class="{% if request.path == '/translate' %}active{% endif %}">Translate</a>
      <a href="/agent" class="{% if request.path == '/agent' %}active{% endif %}">Agent memory</a>
      <a href="/rag" class="{% if request.path == '/rag' %}active{% endif %}">RAG</a>
      <a href="/stress" class="{% if request.path == '/stress' %}active{% endif %}">Stress test</a>
      <a href="/inspector" class="{% if request.path == '/inspector' %}active{% endif %}">Cache inspector</a>
      <a href="/tenants" class="{% if request.path == '/tenants' %}active{% endif %}">Multi-tenant</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <span>Backed by <code>nemotron-3-nano</code> on the local DGX Spark · embedder is local <code>all-MiniLM-L6-v2</code></span>
  </footer>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
